name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  theme-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Install Shopify Theme Check
        run: gem install theme-check

      - name: Run Theme Check
        run: theme-check --fail-level error
